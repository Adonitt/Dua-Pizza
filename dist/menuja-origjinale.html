<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f4eb" />
    <title>Menuja origjinale | DUA Pizza</title>
    <style>
      :root{font-family:Arial,Helvetica,sans-serif;color:#1c1a19;background:#f8f4eb;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
      *{box-sizing:border-box}
      body{margin:0;min-width:320px}
      header{min-height:76px;padding:10px clamp(16px,5vw,64px);display:flex;align-items:center;justify-content:space-between;gap:18px;background:#f8f4eb;border-bottom:1px solid #e8e3d9}
      header img{display:block;width:106px;height:56px;object-fit:contain}
      header a{display:inline-flex;align-items:center;gap:8px;color:#1c1a19;font-weight:700;font-size:13px;text-decoration:none}
      header a:hover{color:#e5252a}
      header a svg{width:17px;height:17px}
      main{width:min(100% - 32px,900px);margin:34px auto 48px}
      h1{font-size:clamp(24px,4vw,38px);margin:0 0 18px;text-transform:uppercase;letter-spacing:-.04em}
      h1 span{color:#e5252a}
      figure{margin:0;background:#100f0e;box-shadow:0 12px 36px #1c1a1920}
      figure img{display:block;width:100%;height:auto}
      @media(max-width:540px){header{min-height:64px;padding:7px 14px}header img{width:88px;height:48px}header a{font-size:11px}main{width:calc(100% - 20px);margin:22px auto 30px}h1{margin-bottom:12px}}
    </style>
  </head>
  <body>
    <header>
      <a href="/#home" aria-label="DUA Pizza, faqja kryesore"><img src="/dua-pizza-logo-red-yellow.png" alt="DUA Pizza" /></a>
      <a href="/#menu">Kthehu te menuja <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
    </header>
    <main>
      <h1>Menuja <span>origjinale</span></h1>
      <figure><img src="/images/menu-origjinale.png" alt="Menuja origjinale e DUA Pizza me pica, sanduiçe dhe pije" /></figure>
    </main>
  </body>
</html>
